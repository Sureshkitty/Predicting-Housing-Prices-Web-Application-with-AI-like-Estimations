<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <link rel="icon" href="logo.jpg" type="image/jpg">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 0;
      margin: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body {
      background-image: url('https://drive.google.com/uc?export=view&id=1THnoErBlCK6CiKGKrpOniJw1SHAEB84Q');
    }


    @media (max-width: 768px) {
      body {
        background-image: url('https://drive.google.com/uc?export=view&id=17fTVNl0FR3JpxeEu-F6sY5jvpH82Mgrm');
      }
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: rgba(190, 182, 182, 0.801);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 10px 15px rgba(0, 0, 0, 0.1);
      flex: 1;
    }

    .header {
      background: linear-gradient(135deg, #28a745, #218838);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 20px;
      border-radius: 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 100%;
      box-sizing: border-box;
    }

    .header img {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }

    .header h1 {
      font-size: 1.8em;
      margin: 0;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 1em;
      text-align: center;
    }

    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #28a745;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    .footer {
      background-color: #23b4458a;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      color: white;
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
    }

    .footer a {
      color: white;
      text-decoration: none;
    }

    .footer a:hover {
      color: #37b92b;
    }

    .icon {
      width: 24px;
      vertical-align: middle;
      filter: brightness(0) invert(1);
    }

    .info {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://img.icons8.com/material-outlined/32/ffffff/comments--v1.png" alt="Feedback Icon">
    <h1>We Value Your Feedback</h1>
    <p>Your thoughts and experiences help us improve. Please share your feedback using the form below.</p>
  </div>

  <div class="container">
    <form id="feedbackForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="text" name="number" placeholder="Your Number" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <input type="number" name="rating" placeholder="Rating (1-5)" min="1" max="5" required>
      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Submit Feedback</button>
    </form>
    <div id="responseMessage"></div>
 
    <div class="info">
      <p>We appreciate you taking the time to provide feedback. Your input helps us serve you better!</p>
    </div>
  </div>

  <div class="footer">
    <a href="mailto:suresh.sherikar1712@gmail.com" title="Email">
      <img class="icon" src="https://img.icons8.com/material-outlined/24/ffffff/email.png" alt="Email Icon"> Email
    </a>
    <a href="https://github.com/Sureshkitty" target="_blank" title="GitHub">
      <img class="icon" src="https://img.icons8.com/material-outlined/24/ffffff/github.png" alt="GitHub Icon"> GitHub
    </a>
    <a href="https://www.linkedin.com/in/suresh-sherikar-320560333" target="_blank" title="LinkedIn">
      <img class="icon" src="https://img.icons8.com/material-outlined/24/ffffff/linkedin.png" alt="LinkedIn Icon"> LinkedIn
    </a>
    <a href="https://www.instagram.com/techie_suresh" target="_blank" title="Instagram">
      <img class="icon" src="https://img.icons8.com/material-outlined/24/ffffff/instagram-new.png" alt="Instagram Icon"> Instagram
    </a>
  </div>

  <script>
   
    document.getElementById('feedbackForm').onsubmit = function(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const data = {};
      formData.forEach((value, key) => (data[key] = value));
      google.script.run.withSuccessHandler(function() {
        document.getElementById('responseMessage').innerText = 'Thank you for your feedback!';
        event.target.reset();
      }).submitForm(data);
    };
  </script>
</body>
</html>
